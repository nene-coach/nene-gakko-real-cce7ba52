const app=document.getElementById('app'),esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function card(t){return `<a class="card" href="#${t.id}"><span>${esc(t.title)}</span><i>›</i></a>`}
function home(q){
 const norm=s=>s.toLowerCase();let h='';let n=0;
 for(const c of DATA){const list=c.themes.filter(t=>!q||norm(t.title+' '+t.s).includes(norm(q)));if(!list.length)continue;n+=list.length;
  h+=`<h2 id="c-${c.key}">${c.icon} ${esc(c.name)}<span class="count">${list.length}テーマ</span></h2>`+list.map(card).join('')}

function renderHome(){
 app.innerHTML=`<input class="search" id="q" type="search" placeholder="学校名・キーワードで探す（例：桐朋、水泳、繊細）" aria-label="テーマを検索">

 const q=document.getElementById('q');q.oninput=()=>document.getElementById('list').innerHTML=home(q.value.trim());
 app.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{q.value='';document.getElementById('list').innerHTML=home('');const e=document.getElementById(b.dataset.c);if(e)e.scrollIntoView({behavior:'smooth'})});
 window.scrollTo(0,window.__y||0)}
function renderTheme(id){
 for(const c of DATA){const t=c.themes.find(x=>x.id===id);if(!t)continue;
  app.innerHTML=`<a class="back" href="#">‹ 一覧へ戻る</a><div class="cat">${c.icon} ${esc(c.name)}</div><div class="title">${esc(t.title)}</div>`+t.blocks.map(b=>b.t?`<p class="note">${esc(b.t)}</p>`:b.l?`<a class="ext" href="${b.l}" target="_blank" rel="noopener">${esc(b.lt)} ↗</a>`:b.v?`<video class="shot" src="img/${b.v}" controls muted playsinline preload="metadata"></video>`:`<img class="shot" loading="lazy" src="img/${b.i}" alt="${esc(t.title)}のスクリーンショット">`).join('')+`<a class="back" href="#">‹ 一覧へ戻る</a>`;

 location.hash=''}
